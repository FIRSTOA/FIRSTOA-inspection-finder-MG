<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #f8fafc; --panel: #ffffff; --line: #e8edf3;
      --ink: #0f172a; --muted: #64748b; --faint: #94a3b8;
      --brand: #2563eb; --brand-d: #1d4ed8; --brand-soft: #eef4ff;
      --side: #0b1220; --side-2: #111c30; --side-ink: #cbd5e1; --side-active: #1e3a8a;
      --ok-bg:#ecfdf5; --ok-bd:#a7f3d0; --ok-ink:#065f46;
      --err-bg:#fef2f2; --err-bd:#fecaca; --err-ink:#991b1b;
      --shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 20px rgba(15,23,42,.06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    .app { display: flex; min-height: 100vh; }

    /* Sidebar */
    .side { width: 248px; background: var(--side); color: var(--side-ink); flex-shrink: 0; display: flex; flex-direction: column; }
    .brand { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.07); }
    .brand .logo { display: flex; align-items: center; gap: 10px; }
    .brand .mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg,#3b82f6,#1d4ed8); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 15px; }
    .brand .name { font-weight: 700; color: #fff; font-size: 15px; line-height: 1.2; }
    .brand .sub { font-size: 11px; color: var(--faint); margin-top: 2px; }
    nav { padding: 14px 12px; flex: 1; }
    nav .grp { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: #5b6b82; padding: 10px 12px 6px; }
    nav button { width: 100%; display: flex; align-items: center; gap: 11px; padding: 11px 12px; margin: 2px 0; border: 0; background: none; color: var(--side-ink); font-size: 14px; font-weight: 500; border-radius: 9px; cursor: pointer; text-align: left; transition: background .12s, color .12s; }
    nav button:hover { background: var(--side-2); color: #fff; }
    nav button.active { background: var(--side-active); color: #fff; }
    nav button svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .9; }
    .side .foot { padding: 14px 18px; border-top: 1px solid rgba(255,255,255,.07); font-size: 11px; color: var(--faint); }

    /* Main */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar { background: var(--panel); border-bottom: 1px solid var(--line); padding: 0 28px; height: 62px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .topbar h1 { font-size: 17px; font-weight: 700; margin: 0; }
    .userchip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
    .userchip .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .content { padding: 26px 28px 60px; max-width: 1080px; width: 100%; }

    .panel { display: none; animation: fade .18s ease; }
    .panel.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* KPI */
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
    .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
    .kpi .l { font-size: 12.5px; color: var(--muted); font-weight: 500; }
    .kpi .v { font-size: 26px; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .kpi .v small { font-size: 13px; font-weight: 600; color: var(--faint); margin-left: 3px; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden; }
    .card .hd { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .card .hd h2 { font-size: 14.5px; font-weight: 700; margin: 0; }
    .card .hd .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .card .bd { padding: 6px 8px 8px; }
    .card .bd.pad { padding: 20px; }

    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    th { color: var(--faint); font-weight: 600; font-size: 11.5px; letter-spacing: .03em; text-transform: uppercase; }
    tbody tr:hover { background: #fbfcfe; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
    .catname { font-weight: 600; }

    .badge { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }
    .badge.sheet { background: var(--brand-soft); color: var(--brand-d); }
    .badge.kakao { background: #fff7ed; color: #c2410c; }
    .muted { color: var(--faint); }
    .sheets { color: var(--muted); font-size: 12.5px; }

    a.btn, button.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; font-size: 13px; font-weight: 600; border-radius: 8px; text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: all .12s; font-family: inherit; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-d); }
    .btn-soft { background: var(--brand-soft); color: var(--brand-d); }
    .btn-soft:hover { background: #e0ebff; }
    .btn-line { background: #fff; color: var(--ink); border-color: var(--line); }
    .btn-line:hover { border-color: #cbd5e1; background: #f8fafc; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .chip { padding: 9px 18px; font-size: 14px; font-weight: 600; border-radius: 999px; border: 1px solid #cbd5e1; background: #fff; color: var(--muted); cursor: pointer; transition: all .12s; font-family: inherit; }
    .chip:hover { border-color: var(--brand); }
    .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }

    .area { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .area-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; margin-bottom: 10px; }
    .slot { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); }
    .slot:first-of-type { border-top: 0; }
    .slot-team { width: 42px; flex-shrink: 0; font-weight: 700; font-size: 13px; color: var(--brand-d); }
    .slot-pick { padding: 7px 13px; font-size: 13px; font-weight: 600; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; font-family: inherit; flex-shrink: 0; }
    .slot-pick:hover { border-color: var(--brand); }
    .slot-pick.has { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-d); }
    .slot-name { flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot-status { flex-shrink: 0; font-size: 12px; font-weight: 600; color: var(--faint); white-space: nowrap; }
    .slot-status.run { color: var(--brand); }
    .slot-status.ok { color: #059669; }
    .slot-status.err { color: #dc2626; }

    .masterbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px; background: linear-gradient(135deg,#1d4ed8,#2563eb); border-radius: 14px; color: #fff; margin-bottom: 22px; box-shadow: var(--shadow); }
    .masterbar .t { font-size: 13px; opacity: .85; }
    .masterbar .n { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .masterbar a { background: rgba(255,255,255,.16); color:#fff; backdrop-filter: blur(4px); }
    .masterbar a:hover { background: rgba(255,255,255,.26); }

    label { display: block; font-weight: 600; margin: 18px 0 7px; font-size: 13.5px; }
    select, input[type=text] { width: 100%; padding: 11px 12px; font-size: 14.5px; border: 1px solid #cbd5e1; border-radius: 9px; font-family: inherit; background: #fff; color: var(--ink); }
    select:focus, input[type=text]:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    input[type=file] { margin-top: 6px; font-size: 13px; }
    #upBtn { margin-top: 22px; width: 100%; padding: 13px; font-size: 15px; font-weight: 700; color: #fff; background: var(--brand); border: 0; border-radius: 10px; cursor: pointer; transition: background .12s; }
    #upBtn:hover { background: var(--brand-d); }
    #upBtn:disabled { background: #9bb6e8; cursor: default; }
    #upResult { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-size: 13.5px; white-space: pre-wrap; display: none; line-height: 1.55; }
    #upResult.ok { background: var(--ok-bg); border: 1px solid var(--ok-bd); color: var(--ok-ink); }
    #upResult.err { background: var(--err-bg); border: 1px solid var(--err-bd); color: var(--err-ink); }
    .hint { color: var(--faint); font-size: 12.5px; margin-top: 6px; line-height: 1.5; }
    .loading { text-align: center; color: var(--faint); padding: 36px; font-size: 13.5px; }
    .spin { display:inline-block; width:16px; height:16px; border:2px solid #dbe3ee; border-top-color: var(--brand); border-radius:50%; animation: sp .7s linear infinite; vertical-align:-3px; margin-right:8px; }
    @keyframes sp { to { transform: rotate(360deg); } }

    @media (max-width: 760px) {
      .app { flex-direction: column; }
      .side { width: 100%; flex-direction: row; align-items: center; overflow-x: auto; }
      .brand { border: 0; padding: 12px 14px; }
      .brand .sub { display: none; }
      nav { display: flex; padding: 8px; }
      nav .grp, .side .foot { display: none; }
      nav button { width: auto; white-space: nowrap; }
      .content { padding: 18px 16px 50px; }
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .topbar { padding: 0 16px; }
      .masterbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="logo">
          <div class="mark">F</div>
          <div>
            <div class="name">퍼스트전산</div>
            <div class="sub">통합 DB 콘솔</div>
          </div>
        </div>
      </div>
      <nav>
        <div class="grp">관리</div>
        <button id="t1" class="active" onclick="showTab(1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          대시보드
        </button>
        <button id="t2" onclick="showTab(2)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
          원본 DB
        </button>
        <button id="t3" onclick="showTab(3)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 20h14"/></svg>
          카톡 업로드
        </button>
      </nav>
      <div class="foot">© 퍼스트전산</div>
    </aside>

    <div class="main">
      <div class="topbar">
        <h1 id="pageTitle">대시보드</h1>
        <div class="userchip"><span class="dot"></span><span id="userline">연결됨</span></div>
      </div>

      <div class="content">
        <!-- 탭1 대시보드 -->
        <section id="p1" class="panel active">
          <div class="masterbar">
            <div>
              <div class="t">통합(마스터) 시트</div>
              <div class="n" id="masterName">불러오는 중…</div>
            </div>
            <a id="masterLink" class="btn" href="#" target="_blank">시트 열기 &nbsp;→</a>
          </div>
          <div class="kpis" id="kpis"></div>
          <div class="card">
            <div class="hd"><div><h2>카테고리별 현황</h2><div class="desc">통합시트에 적재된 영역별 레코드 수</div></div></div>
            <div class="bd"><div id="catCounts" class="loading"><span class="spin"></span>불러오는 중…</div></div>
          </div>
        </section>

        <!-- 탭2 원본 DB -->
        <section id="p2" class="panel">
          <div class="card">
            <div class="hd"><div><h2>원본 DB 목록</h2><div class="desc">미러링 중인 원본 구글시트 — 클릭하면 원본으로 이동</div></div></div>
            <div class="bd"><div id="sources" class="loading"><span class="spin"></span>불러오는 중…</div></div>
          </div>
        </section>

        <!-- 탭3 카톡 업로드 -->
        <section id="p3" class="panel">
          <div class="card">
            <div class="hd"><div><h2>카톡 TXT 업로드</h2><div class="desc">영역별로 파일을 붙이고 [전체 처리]를 누르면 순서대로 적재됩니다 (붙인 것만 처리)</div></div></div>
            <div class="bd pad">
              <div id="uploadAreas" class="loading"><span class="spin"></span>불러오는 중…</div>
              <button id="upBtn" onclick="runAll()" style="display:none">전체 처리</button>
              <div id="upResult"></div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

<script>
  var TITLES = { 1: '대시보드', 2: '원본 DB', 3: '카톡 업로드' };
  var ROOM_MODE = {};
  // 영역별 업로드 슬롯(팀/지역). 빈 문자열 = 단일 파일.
  var AREA_SLOTS = {
    'AS':     ['A', 'B', 'C', 'D'],
    '불만':    ['AB', 'CD'],
    '미수':    ['A', 'B', 'C', 'D'],
    '재계약':  ['A', 'B', 'C', 'D'],
    '해지방어': [''],
    '경영지원': ['']
  };

  function showTab(n) {
    [1,2,3].forEach(function (i) {
      document.getElementById('t' + i).className = (i === n ? 'active' : '');
      document.getElementById('p' + i).className = 'panel' + (i === n ? ' active' : '');
    });
    document.getElementById('pageTitle').textContent = TITLES[n];
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function nf(n) { return (Number(n) || 0).toLocaleString(); }

  function render(data) {
    if (data.user) document.getElementById('userline').textContent = data.user;
    document.getElementById('masterName').textContent = data.master.name;
    document.getElementById('masterLink').href = data.master.url;

    var totalRec = 0, sheetCnt = 0, kakaoCnt = 0;
    data.categories.forEach(function (c) {
      totalRec += (Number(c.count) || 0);
      if (c.kakaoOnly) kakaoCnt++; else sheetCnt++;
    });

    document.getElementById('kpis').innerHTML =
      kpi('전체 레코드', nf(totalRec) + '<small>건</small>') +
      kpi('카테고리', data.categories.length + '<small>개</small>') +
      kpi('원본 연동 DB', sheetCnt + '<small>개</small>') +
      kpi('카톡 전용', kakaoCnt + '<small>개</small>');

    // 탭1 표
    var rows = '<table><tr><th>카테고리</th><th>유형</th><th>통합 탭</th><th class="num">건수</th></tr>';
    data.categories.forEach(function (c) {
      var tab = c.tabUrl ? '<a class="btn btn-soft" href="' + c.tabUrl + '" target="_blank">' + esc(c.tabName) + '</a>' : '<span class="muted">미생성</span>';
      var badge = c.kakaoOnly ? '<span class="badge kakao">카톡</span>' : '<span class="badge sheet">시트연동</span>';
      rows += '<tr><td class="catname">' + esc(c.cat) + '</td><td>' + badge + '</td><td>' + tab + '</td><td class="num">' + nf(c.count) + '</td></tr>';
    });
    rows += '</table>';
    document.getElementById('catCounts').innerHTML = rows;

    // 탭2 표
    var s = '<table><tr><th>카테고리</th><th>원본 시트</th><th>대상 시트</th></tr>';
    data.categories.forEach(function (c) {
      var open = c.kakaoOnly
        ? '<span class="muted">카톡 전용 (원본 시트 없음)</span>'
        : (c.srcUrl ? '<a class="btn btn-line" href="' + c.srcUrl + '" target="_blank">원본 열기 ↗</a>' : '<span class="muted">미연결</span>');
      var sheets = (c.sheets && c.sheets.length) ? esc(c.sheets.join(', ')) : '<span class="muted">-</span>';
      s += '<tr><td class="catname">' + esc(c.cat) + '</td><td>' + open + '</td><td class="sheets">' + sheets + '</td></tr>';
    });
    s += '</table>';
    document.getElementById('sources').innerHTML = s;

    // 탭3 업로드 영역
    ROOM_MODE = {};
    data.kakaoTypes.forEach(function (t) { ROOM_MODE[t.type] = t.mode; });
    renderUploadAreas(data.kakaoTypes);
  }

  function renderUploadAreas(types) {
    var host = document.getElementById('uploadAreas');
    var html = '';
    types.forEach(function (t) {
      var slots = AREA_SLOTS[t.type] || [''];
      var badge = t.mode === 'asform' ? '<span class="badge sheet">양식→AS시트</span>'
                : '<span class="badge kakao">AI</span>';
      html += '<div class="area">';
      html += '<div class="area-head">' + esc(t.type) + ' ' + badge + '</div>';
      slots.forEach(function (team, i) {
        var id = 'slot_' + t.type + '_' + i;
        var teamLabel = team ? team : '단일';
        html += '<div class="slot" data-area="' + esc(t.type) + '" data-team="' + esc(team) + '" data-mode="' + t.mode + '">'
          + '<span class="slot-team">' + esc(teamLabel) + '</span>'
          + '<button type="button" class="slot-pick" onclick="pickFile(\'' + id + '\')">파일 선택</button>'
          + '<span class="slot-name">없음</span>'
          + '<span class="slot-status">대기</span>'
          + '<input type="file" id="' + id + '" accept=".txt,text/plain" style="display:none" onchange="onPick(this)">'
          + '</div>';
      });
      html += '</div>';
    });
    host.className = '';
    host.innerHTML = html;
    document.getElementById('upBtn').style.display = 'block';
  }

  function kpi(l, v) { return '<div class="kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div></div>'; }

  function loadFail(err) {
    var m = '<span class="muted">불러오기 실패: ' + esc(err && err.message) + '</span>';
    document.getElementById('catCounts').innerHTML = m;
    document.getElementById('sources').innerHTML = m;
  }

  google.script.run.withSuccessHandler(render).withFailureHandler(loadFail).getConsoleData();

  // 업로드
  function upShow(cls, msg) { var r = document.getElementById('upResult'); r.className = cls; r.textContent = msg; r.style.display = 'block'; }

  // 파일 선택
  function pickFile(id) { document.getElementById(id).click(); }
  function onPick(input) {
    var slot = input.closest('.slot');
    var pick = slot.querySelector('.slot-pick');
    var name = slot.querySelector('.slot-name');
    if (input.files.length) {
      slot._file = input.files[0];
      pick.classList.add('has');
      name.textContent = input.files[0].name;
      setStatus(slot, '', '대기');
    } else {
      slot._file = null; pick.classList.remove('has'); name.textContent = '없음';
    }
  }
  function setStatus(slot, cls, msg) {
    var s = slot.querySelector('.slot-status');
    s.className = 'slot-status' + (cls ? ' ' + cls : '');
    s.textContent = msg;
  }

  // google.script.run → Promise
  function gasRun(fn, args) {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(google.script.run, args);
    });
  }
  // 파일 → 디코딩된 텍스트
  function readDecoded(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (ev) { resolve(decodeUpload(ev.target.result)); };
      reader.onerror = function () { reject(new Error('파일 읽기 실패')); };
      reader.readAsArrayBuffer(file);
    });
  }

  async function runAll() {
    var slots = Array.prototype.slice.call(document.querySelectorAll('#uploadAreas .slot'))
      .filter(function (s) { return s._file; });
    if (!slots.length) { upShow('err', '파일을 하나 이상 선택하세요.'); return; }

    var btn = document.getElementById('upBtn');
    btn.disabled = true;
    upShow('ok', '처리 시작… (' + slots.length + '개 파일, 순서대로 진행)');
    var totalAdded = 0, failed = 0;

    for (var k = 0; k < slots.length; k++) {
      var slot = slots[k];
      var area = slot.getAttribute('data-area');
      var team = slot.getAttribute('data-team') || '';
      var mode = slot.getAttribute('data-mode');
      var who = area + (team ? '(' + team + ')' : '');
      try {
        setStatus(slot, 'run', '읽는 중…');
        var text = await readDecoded(slot._file);

        if (mode === 'asform') {
          setStatus(slot, 'run', '양식 추출 중…');
          var r = await gasRun('ingestASFormsUpload', [text, team]);
          if (!r || !r.ok) throw new Error(r && r.error ? r.error : '실패');
          setStatus(slot, 'ok', '완료 +' + nf(r.added) + ' (중복 ' + nf(r.skipped) + ')');
          totalAdded += (r.added || 0);
        } else {
          setStatus(slot, 'run', '준비 중…');
          var start = await gasRun('kakaoUploadStart', [area, team, text]);
          if (!start || !start.ok) throw new Error(start && start.error ? start.error : '실패');
          if (!start.batches) { setStatus(slot, 'ok', '새 메시지 없음'); continue; }
          var acc = { added: 0, skipped: 0 };
          for (var i = 0; i < start.batches; i++) {
            setStatus(slot, 'run', '처리 중 ' + (i + 1) + '/' + start.batches);
            var b = await gasRun('kakaoUploadBatch', [i]);
            if (!b || !b.ok) throw new Error(b && b.error ? b.error : '배치 실패');
            acc.added += (b.added || 0); acc.skipped += (b.skipped || 0);
          }
          setStatus(slot, 'ok', '완료 +' + nf(acc.added) + ' (중복 ' + nf(acc.skipped) + ')');
          totalAdded += acc.added;
        }
      } catch (err) {
        failed++;
        setStatus(slot, 'err', '실패: ' + (err && err.message ? err.message : err));
      }
      upShow('ok', '진행 중… ' + (k + 1) + '/' + slots.length + ' 완료  ·  누적 추가 ' + nf(totalAdded) + '건');
    }

    btn.disabled = false;
    upShow(failed ? 'err' : 'ok',
      (failed ? '일부 실패 ' : '전체 완료 ✓ ') + '신규 추가 ' + nf(totalAdded) + '건' +
      (failed ? ' / 실패 ' + failed + '건 (위 항목별 상태 확인)' : '') +
      '\n(통합 탭은 다음 동기화 때 반영됩니다)');
  }

  // 카톡 내보내기 인코딩 자동 판별 (PC=UTF-16, 모바일=UTF-8). BOM 기준.
  function decodeUpload(buffer) {
    var b = new Uint8Array(buffer);
    var enc = 'utf-8';
    if (b.length >= 2 && b[0] === 0xFF && b[1] === 0xFE) enc = 'utf-16le';
    else if (b.length >= 2 && b[0] === 0xFE && b[1] === 0xFF) enc = 'utf-16be';
    var text;
    try { text = new TextDecoder(enc).decode(b); }
    catch (e) { text = new TextDecoder('utf-8').decode(b); }
    return text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
  }
</script>
